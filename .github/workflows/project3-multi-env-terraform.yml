name: Project3 — Multi-Env Terraform

on:
  pull_request:
    paths:
      - "project3-multi-env-terraform/**"
      - ".github/workflows/project3-multi-env-terraform.yml"
  push:
    branches: [main]
    paths:
      - "project3-multi-env-terraform/**"
      - ".github/workflows/project3-multi-env-terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to apply"
        required: true
        default: "dev"
        type: choice
        options: [dev, staging, prod]

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: project3-${{ github.event.inputs.environment || 'dev' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  validate:
    name: Validate (fmt, validate, tfsec, checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: project3-multi-env-terraform

      - name: Init & Validate (all envs)
        run: |
          for env in dev staging prod; do
            echo "=== Validating $env ==="
            cd project3-multi-env-terraform/environments/$env
            terraform init -backend=false
            terraform validate
            cd - > /dev/null
          done

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: project3-multi-env-terraform
          soft_fail: false

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: project3-multi-env-terraform
          framework: terraform
          soft_fail: false
          config_file: project3-multi-env-terraform/policies/.checkov.yml

  plan:
    name: Terraform Plan
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]
    defaults:
      run:
        working-directory: project3-multi-env-terraform/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      # - name: Configure AWS credentials (OIDC)
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: arn:aws:iam::ACCOUNT_ID:role/github-actions-terraform-${{ matrix.environment }}
      #     aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: project3-multi-env-terraform/environments/${{ matrix.environment }}/tfplan
          retention-days: 5

      - name: Comment plan summary on PR
        if: github.event_name == 'pull_request' && matrix.environment == 'dev'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = '';
            try {
              plan = fs.readFileSync('project3-multi-env-terraform/environments/dev/plan_output.txt', 'utf8');
            } catch (e) { plan = 'Plan output not available'; }
            const body = `### Terraform Plan — Project 3 (dev)\n\\`\\`\\`\n${plan.slice(0, 60000)}\\`\\`\\`\n\n*Full plans for staging/prod available as artifacts.*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  apply:
    name: Terraform Apply (approval required)
    needs: [validate, plan]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}  # <-- Approval gate via GitHub Environments
    defaults:
      run:
        working-directory: project3-multi-env-terraform/environments/${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      # - name: Configure AWS credentials (OIDC)
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: arn:aws:iam::ACCOUNT_ID:role/github-actions-terraform-${{ github.event.inputs.environment || 'dev' }}
      #     aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Apply
        run: terraform apply -auto-approve
