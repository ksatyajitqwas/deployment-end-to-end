name: Docs & Repo Health

on:
  pull_request:
    paths:
      - "**.md"
      - ".github/**"
  push:
    branches: [main]
    paths:
      - "**.md"
      - ".github/**"

permissions:
  contents: read

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check key READMEs exist
        run: |
          for p in project{1..7}-*/README.md; do
            test -f "$p" && echo "OK $p" || (echo "Missing $p" && exit 1)
          done
          test -f README.md
          echo "All project READMEs present"
