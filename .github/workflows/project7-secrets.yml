name: Project7 — Secrets Management

on:
  pull_request:
    paths:
      - "project7-secrets-management/**"
      - ".github/workflows/project7-secrets.yml"
  push:
    branches: [main]
    paths:
      - "project7-secrets-management/**"
      - ".github/workflows/project7-secrets.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: project7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Terraform & docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project7-secrets-management/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - run: terraform init -backend=false
      - run: terraform validate

      - name: Ensure no plaintext secrets in repo
        run: |
          # Simple guard — fail if obvious secret patterns appear in this project
          if grep -rE '(password|secret|api[_-]?key)\s*[:=]\s*["'\''][^"'\'']{8,}' project7-secrets-management --include='*.tf' --include='*.yaml' --include='*.yml' --include='*.md' | grep -v 'supersecret' | grep -v 'example'; then
            echo "Possible hardcoded secret found — review above"
            exit 1
          fi
          echo "No obvious hardcoded secrets detected"

  apply:
    name: Apply secrets infra (approval required)
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder apply
        run: |
          echo "Would create secret *containers* via Terraform (values set outside CI)."
          echo "Gated by GitHub Environment approval."
